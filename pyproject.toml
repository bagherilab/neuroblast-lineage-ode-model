[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroblast-lineage-ode-model"
version = "0.1.0"
description = "ODE model and figure generation code for manuscript 'Cell size asymmetry regulates neural stem cell proliferation and lineage expansion in vivo and in silico models'"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Sophia Kehn Jannetty" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.urls]
Repository = "https://github.com/bagherilab/neuroblast-lineage-ode-model"

[tool.setuptools]
packages = ["neuroblast_ode"]
